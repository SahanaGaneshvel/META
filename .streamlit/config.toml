[theme]
base = "dark"
primaryColor = "#2dd4bf"
backgroundColor = "#0a0f1c"
secondaryBackgroundColor = "#111a2b"
textColor = "#e8ecf4"
borderColor = "#1e293b"
linkColor = "#5eead4"
baseRadius = "0.85rem"
showWidgetBorder = true
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
headingFontWeights = 600
chartCategoricalColors = ["#5eead4", "#f59e0b", "#818cf8", "#fb7185", "#94a3b8"]

[theme.sidebar]
backgroundColor = "#0d1424"
secondaryBackgroundColor = "#131c2f"

[client]
toolbarMode = "minimal"

[server]
maxUploadSize = 50
